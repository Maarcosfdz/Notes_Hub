name: notes-hub-local
services:
  app:
    image: ${NOTES_IMAGE:-notes-hub:local}
    build:
      context: .
      target: runtime
    environment:
      NOTES_ORIGIN: ${NOTES_ORIGIN:-http://127.0.0.1:4329}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Genera y configura un secreto local de al menos 32 caracteres}
      NOTES_DB_PATH: /data/notes-hub.sqlite
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4321"
    ports:
      - "127.0.0.1:${NOTES_PORT:-4329}:4321"
    volumes:
      - notes_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  notes_data:
